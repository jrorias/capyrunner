[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capyrunner"
version = "0.5.2"
description = "A running mascot in your tray / on your desktop that reacts to your tasks, notes and notifications."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Devjr" }]
dependencies = [
    "PySide6-Essentials>=6.5",   # only Core, Gui, Widgets, Network: a much smaller download than full PySide6
    "psutil>=5.9",
    # Windows: what is playing (Spotify, browsers, Media Player…) from the system media controls
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]

[project.gui-scripts]
capyrunner = "capyrunner.app:main"

[tool.setuptools]
packages = ["capyrunner", "capyrunner.assets"]

[tool.setuptools.package-data]
"capyrunner.assets" = ["*.png"]

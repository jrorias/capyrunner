[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capyrunner"
version = "0.1.1"
description = "A running mascot in your tray / on your desktop that reacts to your tasks, notes and notifications."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Capytech" }]
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
]

[project.gui-scripts]
capyrunner = "capyrunner.app:main"

[tool.setuptools]
packages = ["capyrunner", "capyrunner.assets"]

[tool.setuptools.package-data]
"capyrunner.assets" = ["*.png"]
